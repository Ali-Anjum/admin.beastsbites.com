<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers</title>
<style>
:root{--green:#537457;--green-dark:#3c5540;--cream:#fdf3e7;--white:#ffffff;}
html{-webkit-text-size-adjust:100%;}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:var(--cream);padding:clamp(16px,3vw,40px);overflow-x:hidden;}
.container{max-width:1150px;width:min(100%,1150px);margin:auto;}
.top-nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
.header{display:grid;grid-template-columns:1fr auto;align-items:center;margin-bottom:25px;gap:15px;}
.header h1{color:var(--green-dark);font-size:34px;}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end;min-width:0;}
input{padding:12px;width:320px;max-width:100%;border:2px solid var(--green);border-radius:8px;font-size:15px;outline:none;min-width:0;}
input:focus{border-color:var(--green-dark);}
button{padding:12px 18px;border:none;background:var(--green);color:white;border-radius:8px;cursor:pointer;font-size:15px;transition:.2s;}
button:hover{background:var(--green-dark);} 
.logout-btn{background:#b42318;}
.logout-btn:hover{background:#8f2017;}
.top-nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
.top-nav button{padding:10px 16px; border-radius:8px; background:var(--green); color:white; border:none; cursor:pointer; transition:.2s;}
.top-nav button:hover{background:var(--green-dark);}
.header{display:grid;grid-template-columns:1fr auto;align-items:center;margin-bottom:25px;gap:15px;}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end;min-width:0;}
input{padding:12px;width:320px;max-width:100%;border:2px solid var(--green);border-radius:8px;font-size:15px;outline:none;min-width:0;}
input:focus{border-color:var(--green-dark);}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.08);width:100%;}
table{width:100%;border-collapse:collapse;background:white;min-width:760px;}
thead{background:var(--green);color:white;}
th,td{padding:16px;text-align:left;border-bottom:1px solid #eee;}
tbody tr:nth-child(even){background:#faf7f2;}
tbody tr:hover{background:#eef3ec;}
.loading,.empty{text-align:center;margin-top:25px;font-size:18px;}
.status-badge{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:bold;color:white;}
.status-badge.active{background:#1e6b33;}
.status-badge.expired{background:#b42318;}
.pagination{margin-top:25px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
.pagination button{padding:8px 15px;}
.pagination button.active{background:#c2823f;}
.row-actions button{padding:8px 12px;margin-right:8px;}
@media(max-width:900px){
  .header{grid-template-columns:1fr;}
  .controls{justify-content:flex-start;}
  .controls input{width:100%;max-width:100%;}
  .controls > *{flex:1 1 100%;}
}
@media(max-width:700px){
  .top-nav{flex-direction:column;align-items:stretch;}
  .top-nav button,.controls button,.logout-btn{width:100%;}
  .header{grid-template-columns:1fr;}
  .controls{width:100%;justify-content:stretch;flex-direction:column;align-items:stretch;}
  .controls input,.controls button,.logout-btn{width:100%;}
  th,td{padding:12px 10px;}
  .row-actions button{width:auto;min-width:72px;}
}
</style>
</head>
<body>
<div class="container">
  <div class="top-nav">
    <button onclick="location.href='/dashboard'">Dashboard</button>
    <button onclick="location.href='/dashboard/customers/add'">Add Customer</button>
    <button onclick="location.href='/dashboard/deliveries'">Deliveries</button>
    <button onclick="location.href='/dashboard/logs'">Logs</button>
  </div>
  <div class="header">
    <h1>Customers</h1>
    <div class="controls">
      <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
      <input id="search" placeholder="Search name, phone or location...">
      <button id="addCustomerBtn" style="display:none;" onclick="location.href='/dashboard/customers/add'">+ Add Customer</button>
    </div>
  </div>
  <div id="loading" class="loading">Loading customers...</div>
  <div class="table-wrap" id="tableWrap" style="display:none;">
    <table id="table">
      <thead>
        <tr>
          <th>Customer ID</th>
          <th>Name</th>
          <th>Phone Number</th>
          <th>Veg/Non-Veg</th>
          <th>Status</th>
          <th>Active Till</th>
          <th>Meals</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div id="empty" class="empty" style="display:none;">No customers found.</div>
  <div id="pagination" class="pagination"></div>
</div>
<script>
let currentPage = 1;
let totalPages = 1;

async function load(page = 1){
  const search = document.getElementById("search").value;
  document.getElementById("loading").style.display = "block";
  const res = await fetch(`/dashboard/customers/data?page=${page}&search=${encodeURIComponent(search)}`, { credentials: "include" });
  const data = await res.json();
  document.getElementById("loading").style.display = "none";

  if (!data.success) {
    alert(data.message);
    return;
  }

  if (data.role === "Owner" || data.role === "Manager") {
    document.getElementById("addCustomerBtn").style.display = "inline-block";
  }

  const tableWrap = document.getElementById("tableWrap");
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  if (data.customers.length === 0) {
    tableWrap.style.display = "none";
    document.getElementById("empty").style.display = "block";
  } else {
    tableWrap.style.display = "block";
    document.getElementById("empty").style.display = "none";
  }

  data.customers.forEach(customer => {
    tbody.innerHTML += `
      <tr>
        <td>${customer.customers_id}</td>
        <td>${customer.customers_name}</td>
        <td>${customer.phone_number}</td>
        <td>${customer.diet_preference || "-"}</td>
        <td><span class="status-badge ${String(customer.status || "Expired").toLowerCase()}">${customer.status || "Expired"}</span></td>
        <td>${customer.active_till || "-"}</td>
        <td>${(customer.meal_time || []).join(", ") || "-"}</td>
        <td class="row-actions">
          <button onclick="window.location.href='/dashboard/customers/${customer.customers_id}'">Open</button>
        </td>
      </tr>`;
  });

  currentPage = data.currentPage;
  totalPages = data.totalPages;
  renderPagination();
}

function renderPagination(){
  const div = document.getElementById("pagination");
  div.innerHTML = "";
  if (totalPages <= 1) return;
  for (let i = 1; i <= totalPages; i++) {
    div.innerHTML += `<button class="${i === currentPage ? "active" : ""}" onclick="load(${i})">${i}</button>`;
  }
}

let timer;
document.getElementById("search").addEventListener("input", (event) => {
  const cleanValue = event.target.value.replace(/[^a-zA-Z0-9 ]/g, "");
  if (cleanValue !== event.target.value) {
    event.target.value = cleanValue;
  }
  clearTimeout(timer);
  timer = setTimeout(() => load(1), 300);
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await fetch("/login/logout", { method: "POST", credentials: "include" });
  window.location.href = "/login";
});

load();
</script>
<script src="/app-header.js"></script>
</body>
</html>
