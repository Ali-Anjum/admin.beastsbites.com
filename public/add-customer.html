<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Customer</title>

<style>

:root{
    --green:#537457;
    --green-dark:#3c5540;
    --cream:#fdf3e7;
    --ink:#26301f;
}

html{-webkit-text-size-adjust:100%;}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:var(--cream);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:clamp(16px,3vw,20px);
}

.card{
    width:100%;
    max-width:520px;
    background:#fff;
    border-radius:14px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

h1{
    color:var(--green-dark);
    margin-bottom:20px;
}

label{
    display:block;
    margin:14px 0 8px;
    font-weight:bold;
    color:var(--ink);
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    font-size:15px;
    outline:none;
    background:#fff;
}

textarea{
    resize:vertical;
    min-height:80px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--green);
}

.radio-group,
.checkbox-group{
    display:flex;
    gap:20px;
    margin-top:6px;
    flex-wrap:wrap;
}

.radio-group label,
.checkbox-group label{
    display:flex;
    align-items:center;
    gap:6px;
    margin:0;
    font-weight:normal;
    cursor:pointer;
}

.radio-group input,
.checkbox-group input{
    width:auto;
}

button{
    width:100%;
    margin-top:24px;
    padding:13px;
    border:none;
    border-radius:8px;
    background:var(--green);
    color:#fff;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    background:var(--green-dark);
}

button:disabled{
    background:#aaa;
    cursor:not-allowed;
}

#message{
    margin-top:14px;
    font-weight:bold;
}

.success{
    color:green;
}

.error{
    color:#b42318;
}

.hint{
    font-size:12px;
    color:#777;
    margin-top:4px;
    font-weight:normal;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
}

.logout-btn{
    width:auto;
    margin-top:0;
    padding:10px 14px;
    background:#b42318;
}

.logout-btn:hover{background:#8f2017;}

@media (max-width: 640px){
    .card{padding:24px 18px;border-radius:12px;}
    .radio-group,
    .checkbox-group{flex-direction:column;align-items:flex-start;gap:10px;}
    button{margin-top:20px;}
}

</style>
</head>
<body>

<div class="card">
    <div class="topbar">
        <h1>Add Customer</h1>
        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
    </div>

    <form id="customerForm">
        <label for="customers_name">Customer Name</label>
        <input id="customers_name" type="text" required>

        <label for="phone_number">Phone Number</label>
        <input id="phone_number" type="text" required>

        <label for="location">Location</label>
        <input id="location" type="text" placeholder="Enter customer address or area" required>

        <label>Veg / Non-Veg</label>
        <div class="radio-group">
            <label><input type="radio" name="diet_preference" value="Veg" required> Veg</label>
            <label><input type="radio" name="diet_preference" value="Non-Veg"> Non-Veg</label>
        </div>

        <label for="active_till">Active Till</label>
        <select id="active_till" required>
            <option value="" disabled selected>Select an expiry date</option>
        </select>
        <div class="hint">Only upcoming dates are available. The customer status becomes Active until this date and Expired after it passes.</div>

        <label for="meal_time">Meal Time</label>
        <div class="checkbox-group">
            <label><input type="checkbox" name="meal_time" value="Breakfast"> Breakfast</label>
            <label><input type="checkbox" name="meal_time" value="Lunch"> Lunch</label>
            <label><input type="checkbox" name="meal_time" value="Dinner"> Dinner</label>
        </div>

        <label for="delivery_guy">Delivery Guy</label>
        <select id="delivery_guy" required>
            <option value="" disabled selected>Loading delivery guys...</option>
        </select>
        <div class="hint">Only usernames with the Delivery-Guy role are listed.</div>

        <label for="comments">Comments</label>
        <textarea id="comments" placeholder="Any notes for this customer (optional)"></textarea>

        <button type="submit" id="submitBtn">Add Customer</button>
    </form>

    <div id="message"></div>
</div>

<script>

const deliveryGuySelect = document.getElementById("delivery_guy");
const submitBtn = document.getElementById("submitBtn");
const messageEl = document.getElementById("message");
const activeTillSelect = document.getElementById("active_till");

function formatDateOption(date) {
    return date.toLocaleDateString("en-GB", {
        weekday: "short",
        year: "numeric",
        month: "short",
        day: "numeric"
    });
}

function toDateKey(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
}

function populateActiveTillOptions() {
    const startDate = new Date();
    startDate.setHours(0, 0, 0, 0);

    for (let offset = 0; offset <= 30; offset += 1) {
        const date = new Date(startDate);
        date.setDate(date.getDate() + offset);

        const option = document.createElement("option");
        option.value = toDateKey(date);
        option.textContent = formatDateOption(date);
        activeTillSelect.appendChild(option);
    }
}

populateActiveTillOptions();

async function loadDeliveryGuys() {
    try {
        const res = await fetch("/dashboard/customers/delivery-guys", {
            method: "GET",
            credentials: "include"
        });
        const data = await res.json();

        deliveryGuySelect.innerHTML = "";

        if (!data.success || !data.deliveryGuys || data.deliveryGuys.length === 0) {
            const opt = document.createElement("option");
            opt.value = "";
            opt.textContent = "No delivery guys available";
            opt.disabled = true;
            opt.selected = true;
            deliveryGuySelect.appendChild(opt);
            submitBtn.disabled = true;
            return;
        }

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Select a delivery guy";
        placeholder.disabled = true;
        placeholder.selected = true;
        deliveryGuySelect.appendChild(placeholder);

        data.deliveryGuys.forEach((username) => {
            const opt = document.createElement("option");
            opt.value = username;
            opt.textContent = username;
            deliveryGuySelect.appendChild(opt);
        });
    } catch (err) {
        deliveryGuySelect.innerHTML = '<option value="" disabled selected>Failed to load</option>';
        submitBtn.disabled = true;
    }
}

loadDeliveryGuys();

document.getElementById("logoutBtn").addEventListener("click", async () => {
    await fetch("/login/logout", { method: "POST", credentials: "include" });
    window.location.href = "/login";
});

document.getElementById("customerForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const customers_name = document.getElementById("customers_name").value.trim();
    const phone_number = document.getElementById("phone_number").value.trim();
    const location = document.getElementById("location").value.trim();
    const diet_preference = document.querySelector('input[name="diet_preference"]:checked')?.value;
    const active_till = document.getElementById("active_till").value;
    const meal_time = Array.from(document.querySelectorAll('input[name="meal_time"]:checked')).map(el => el.value);
    const delivery_guy = document.getElementById("delivery_guy").value;
    const comments = document.getElementById("comments").value.trim();

    if (!diet_preference) {
        messageEl.className = "error";
        messageEl.textContent = "Please select Veg or Non-Veg.";
        return;
    }

    if (meal_time.length === 0) {
        messageEl.className = "error";
        messageEl.textContent = "Please select at least one meal time.";
        return;
    }

    const payload = {
        customers_name,
        phone_number,
        location,
        diet_preference,
        active_till,
        meal_time,
        delivery_guy,
        comments
    };

    try {
        const res = await fetch("/dashboard/customers/add", {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!data.success) {
            messageEl.className = "error";
            messageEl.textContent = data.message || "Failed to add customer.";
            return;
        }

        messageEl.className = "success";
        messageEl.textContent = "Customer added successfully.";

        const customerId = data.customer?.customers_id;
        if (customerId) {
            window.location.href = `/dashboard/customers/${customerId}`;
        } else {
            window.location.href = "/dashboard/customers";
        }
    } catch (err) {
        messageEl.className = "error";
        messageEl.textContent = "Internal error while adding customer.";
    }
});

</script>

</body>
</html>
