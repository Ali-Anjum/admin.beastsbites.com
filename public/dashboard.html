<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
:root{
    --green:#537457;
    --green-dark:#3c5540;
    --cream:#fdf3e7;
    --ink:#26301f;
    --amber:#c2823f;
}
html{-webkit-text-size-adjust:100%;}
*{box-sizing:border-box;font-family:Arial,sans-serif;}
body{margin:0;background:var(--cream);color:var(--ink);padding:clamp(16px,3vw,24px);min-height:100vh;}
.container{max-width:1100px;margin:auto;}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
.top-right{display:flex;align-items:center;gap:10px;}
.pill{display:inline-block;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid #ddd;}
.logout-btn{padding:8px 12px;border:none;border-radius:8px;background:#b42318;color:#fff;font-weight:bold;cursor:pointer;}
.logout-btn:hover{background:#8f2017;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 8px 20px rgba(0,0,0,.08);}
.card h3{margin:0 0 10px;color:var(--green-dark);}
.card p{margin:0 0 12px;}
.card a{display:inline-block;text-decoration:none;padding:10px 12px;border-radius:8px;background:var(--green);color:#fff;font-weight:bold;}
.hidden{display:none;}
@media (max-width: 720px){
    .top{align-items:flex-start;}
    .top-right{width:100%;flex-direction:column;align-items:stretch;}
    .top-right > *{width:100%;}
    .grid{grid-template-columns:1fr;}
    .owner-box{padding:16px;}
    .backup-actions{flex-direction:column;}
    .backup-actions button,
    .backup-actions input{width:100%;min-width:0;}
}
</style>
</head>
<body>
<div class="container">
    <div class="top">
        <h1>Dashboard</h1>
        <div class="top-right">
            <span class="pill" id="who">Loading user...</span>
            <button class="logout-btn" id="logoutBtn" type="button">Logout</button>
        </div>
    </div>

    <div class="grid">
        <div class="card" id="deliveriesCard">
            <h3>Deliveries</h3>
            <p id="deliveryCount">0 deliveries</p>
            <a href="/dashboard/delivery">Open Deliveries</a>
        </div>

        <div class="card" id="customersCard">
            <h3>Customers</h3>
            <p id="customerCount">0 customers</p>
            <a href="/dashboard/customers">Open Customers</a>
        </div>

        <div class="card hidden" id="usersCard">
            <h3>Users</h3>
            <p id="userCount">0 users</p>
            <a href="/dashboard/users">Open Users</a>
        </div>

        <div class="card" id="addDeliveryCard">
            <h3>Add Delivery</h3>
            <p>Create and assign orders to delivery guys.</p>
            <a href="/dashboard/delivery/add">Create Delivery</a>
        </div>

        <div class="card hidden" id="logsCard">
            <h3>Logs</h3>
            <p>View manager activity audit logs.</p>
            <a href="/logs">Open Logs</a>
        </div>
    </div>

</div>

<script src="/app-header.js"></script>
<script>
let caps = null;

async function loadDashboard(){
    const res = await fetch("/dashboard/data", { credentials: "include" });
    const data = await res.json();

    if(!data.success){
        alert(data.message || "Failed to load dashboard");
        return;
    }

    caps = data.capabilities;

    document.getElementById("who").textContent = `${data.user.username} (${data.user.role})`;
    document.getElementById("deliveryCount").textContent = `${data.counts.deliveries} deliveries`;
    document.getElementById("customerCount").textContent = `${data.counts.customers} customers`;
    document.getElementById("userCount").textContent = `${data.counts.users || 0} users`;

    if(!caps.canViewCustomers){
        document.getElementById("customersCard").classList.add("hidden");
    }

    if(data.counts.users > 0){
        document.getElementById("usersCard").classList.remove("hidden");
    }

    if(!caps.canAddDelivery){
        document.getElementById("addDeliveryCard").classList.add("hidden");
    }

    if(caps.canViewLogs){
        document.getElementById("logsCard").classList.remove("hidden");
    }

}

loadDashboard();

document.getElementById("logoutBtn").addEventListener("click", async () => {
    await fetch("/login/logout", {
        method: "POST",
        credentials: "include"
    });

    window.location.href = "/login";
});
</script>
</body>
</html>
